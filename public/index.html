<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDico | Keyword Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #F8FAFC;
            --bg-dark: #0F172A;
            --text-light: #1E293B;
            --text-dark: #F1F5F9;
            --accent-ts: #3178C6;
            --accent-java: #E76F51;
            --accent-mongo: #47A248;
            --accent-python: #3776AB;
            --line-light: #CBD5E1;
            --line-dark: #334155;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        [data-theme="dark"] {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .node {
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .node:hover {
            filter: brightness(1.2);
        }

        .link {
            stroke-opacity: 0.4;
            transition: stroke-opacity 0.2s ease, stroke-width 0.2s ease;
        }

        .link.highlighted {
            stroke-opacity: 1;
            stroke-width: 2px;
        }

        .tab-active {
            position: relative;
            color: currentColor;
            font-weight: 600;
        }

        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: currentColor;
            border-radius: 2px;
        }

        .info-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .hidden-panel {
            transform: translateX(110%);
            opacity: 0;
            pointer-events: none;
        }

        /* Glow effect for nodes */
        .node-glow {
            filter: url(#glow);
        }

        /* Pannable/zoomable canvas cursor */
        #viz svg {
            cursor: grab;
        }

        #viz svg:active {
            cursor: grabbing;
        }

        /* Scrollable sidebar (detail panel) */
        #info-panel {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
        }

        /* Scrollable tooltip (guards against overly long content) */
        #tooltip {
            max-width: 260px;
            max-height: 220px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
        }

        #info-panel::-webkit-scrollbar,
        #tooltip::-webkit-scrollbar {
            width: 6px;
        }

        #info-panel::-webkit-scrollbar-track,
        #tooltip::-webkit-scrollbar-track {
            background: transparent;
        }

        #info-panel::-webkit-scrollbar-thumb,
        #tooltip::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.5);
            border-radius: 999px;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- UI Overlay -->
    <div class="fixed top-0 left-0 w-full p-6 z-10 flex justify-between items-start pointer-events-none">
        <div class="pointer-events-auto">
            <h1 class="text-3xl font-extrabold tracking-tight mb-6">DevDico <span class="text-slate-500 font-normal text-lg">Keyword Map</span></h1>

            <div class="flex flex-col gap-6">
                <nav id="language-tabs" class="flex gap-6 text-sm opacity-70">
                    <!-- Tabs injected here -->
                </nav>

                <div class="relative w-64 group">
                    <input id="search-input" type="text" placeholder="Search keywords..."
                        class="w-full px-4 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700
                        text-sm mono outline-none focus:ring-2 focus:ring-slate-400 transition-all placeholder:text-slate-400">
                    <div class="absolute right-3 top-2.5 opacity-40 group-hover:opacity-100 transition-opacity">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="pointer-events-auto flex gap-3">
            <button id="recenter-btn" title="Recenter graph" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 transition-colors hover:scale-110 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8a4 4 0 100 8 4 4 0 000-8z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2"></path></svg>
            </button>
            <button id="theme-toggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 transition-colors hover:scale-110 active:scale-95">
                <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z"></path></svg>
                <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="fixed z-50 pointer-events-none opacity-0 transition-opacity duration-200 px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-xl text-xs mono">
    </div>

    <!-- Detail Panel -->
    <div id="info-panel" class="info-panel hidden-panel fixed top-0 right-0 h-full w-96 p-8 z-20 border-l border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80">
        <button id="close-panel" class="absolute top-6 right-6 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div id="panel-content" class="mt-12">
            <!-- Content injected here -->
        </div>
    </div>

    <!-- Visualization -->
    <div id="viz" class="w-full h-full"></div>

    <script type="module">
        import { DATA } from '../dist/index.js';

        let currentLang = 'TypeScript';
        let theme = 'dark';

        const svg = d3.select('#viz')
            .append('svg')
            .attr('width', '100%')
            .attr('height', '100%')
            .attr('viewBox', '0 0 1000 1000')
            .attr('preserveAspectRatio', 'xMidYMid meet');

        // Glow Filter
        const defs = svg.append('defs');
        const filter = defs.append('filter')
            .attr('id', 'glow')
            .attr('x', '-50%')
            .attr('y', '-50%')
            .attr('width', '200%')
            .attr('height', '200%');

        filter.append('feGaussianBlur')
            .attr('stdDeviation', '3')
            .attr('result', 'coloredBlur');

        filter.append('feMerge')
            .append('feMergeNode').attr('in', 'coloredBlur');
        filter.append('feMerge')
            .append('feMergeNode').attr('in', 'SourceGraphic');

        const g = svg.append('g');
        const linkGroup = g.append('g').attr('class', 'links');
        const nodeGroup = g.append('g').attr('class', 'nodes');

        // Pan (click + drag on empty canvas) and zoom (scroll wheel / pinch)
        const zoom = d3.zoom()
            .scaleExtent([0.2, 5])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });

        svg.call(zoom).call(zoom.transform, d3.zoomIdentity);

        const simulation = d3.forceSimulation()
            .force('link', d3.forceLink().id(d => d.id).distance(120))
            .force('charge', d3.forceManyBody().strength(-800))
            .force('center', d3.forceCenter(500, 500))
            .force('collision', d3.forceCollide().radius(d => d.size + 20));

        // Drag-to-reposition behavior for individual nodes.
        // d3-drag suppresses the subsequent click when an actual drag
        // happened, so the existing click-to-open-details handler keeps
        // working for plain clicks.
        function drag(sim) {
            function dragstarted(event, d) {
                if (event.sourceEvent) event.sourceEvent.stopPropagation();
                if (!event.active) sim.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) sim.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }

        function initTabs() {
            const nav = document.getElementById('language-tabs');
            Object.keys(DATA).forEach(lang => {
                const btn = document.createElement('button');
                btn.className = `transition-all duration-200 hover:opacity-100 ${lang === currentLang ? 'tab-active opacity-100' : 'opacity-50'}`;
                btn.textContent = lang;
                btn.onclick = () => switchLanguage(lang);
                btn.dataset.lang = lang;
                nav.appendChild(btn);
            });
        }

        function switchLanguage(lang) {
            currentLang = lang;

            // Update Tabs
            document.querySelectorAll('#language-tabs button').forEach(btn => {
                btn.classList.toggle('tab-active', btn.dataset.lang === lang);
                btn.classList.toggle('opacity-100', btn.dataset.lang === lang);
                btn.classList.toggle('opacity-50', btn.dataset.lang !== lang);
            });

            renderGraph();
        }

        function renderGraph() {
            const langData = DATA[currentLang];
            const nodes = [...langData.nodes];
            nodes.forEach(n => {
                n.x = 500 + (Math.random() - 0.5) * 100;
                n.y = 500 + (Math.random() - 0.5) * 100;
            });
            const links = [];

            // Root link
            const root = nodes.find(n => n.group === 'root');
            nodes.forEach(n => {
                if (n.group === 'cat') {
                    links.push({ source: root.id, target: n.id });
                } else if (n.group === 'key') {
                    links.push({ source: n.parent, target: n.id });
                }
            });

            linkGroup.selectAll('*').remove();
            nodeGroup.selectAll('*').remove();

            const link = linkGroup.selectAll('line')
                .data(links)
                .enter().append('line')
                .attr('class', 'link')
                .attr('stroke', theme === 'dark' ? 'var(--line-dark)' : 'var(--line-light)')
                .attr('stroke-width', 1);

            const node = nodeGroup.selectAll('g')
                .data(nodes)
                .enter().append('g')
                .attr('class', 'node')
                .on('click', (event, d) => showDetails(d))
                .on('mouseover', (event, d) => {
                    highlightPath(d, links);
                    showTooltip(event, d);
                })
                .on('mousemove', (event) => {
                    updateTooltipPosition(event);
                })
                .on('mouseout', () => {
                    resetHighlight();
                    hideTooltip();
                });

            node.append('circle')
                .attr('r', d => d.size)
                .attr('fill', d => {
                    if (d.group === 'root') return langData.color;
                    if (d.group === 'cat') return theme === 'dark' ? '#1E293B' : '#E2E8F0';
                    return theme === 'dark' ? '#334155' : '#F1F5F9';
                })
                .attr('stroke', d => d.group === 'root' ? 'none' : langData.color)
                .attr('stroke-width', 2)
                .attr('class', d => d.group === 'root' ? 'node-glow' : '');

            node.append('text')
                .text(d => d.label)
                .attr('text-anchor', 'middle')
                .attr('dy', '.35em')
                .attr('fill', d => d.group === 'root' ? '#FFF' : (theme === 'dark' ? '#CBD5E1' : '#475569'))
                .attr('class', 'mono text-[10px] font-medium pointer-events-none')
                .style('font-size', d => d.group === 'root' ? '14px' : '10px')
                .style('font-weight', d => d.group === 'root' ? 'bold' : 'normal');

            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-1000))
                .force('x', d3.forceX(500).strength(0.1))
                .force('y', d3.forceY(500).strength(0.1))
                .force('collision', d3.forceCollide().radius(d => d.size + 20))
                .on('tick', () => {
                    link.attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);

                    node.attr('transform', d => `translate(${d.x},${d.y})`);
                });

            node.call(drag(simulation));

            simulation.alpha(1).restart();
        }

        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            let content = `<strong>${d.label}</strong>`;

            if (d.params && d.params.length > 0) {
                content += `<div class="mt-1 text-slate-500">Params: <span class="text-slate-800 dark:text-slate-200">${d.params.join(', ')}</span></div>`;
            } else if (d.group === 'key') {
                content += `<div class="mt-1 text-slate-500">No parameters</div>`;
            }

            tooltip.innerHTML = content;
            tooltip.classList.remove('opacity-0');
            updateTooltipPosition(event);
        }

        function updateTooltipPosition(event) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = (event.clientX + 15) + 'px';
            tooltip.style.top = (event.clientY + 15) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.add('opacity-0');
        }

        function highlightPath(node, allLinks) {
            const path = new Set();
            let current = node;

            // Trace back to root
            while (current && current.parent) {
                const link = allLinks.find(l =>
                    (l.source.id === current.parent && l.target.id === current.id) ||
                    (l.target.id === current.parent && l.source.id === current.id)
                );
                if (link) path.add(link);
                current = DATA[currentLang].nodes.find(n => n.id === current.parent);
            }

            // Root connect
            const root = DATA[currentLang].nodes.find(n => n.group === 'root');
            const rootLink = allLinks.find(l =>
                (l.source.id === root.id && l.target.id === (node.group === 'cat' ? node.id : node.parent)) ||
                (l.target.id === root.id && l.source.id === (node.group === 'cat' ? node.id : node.parent))
            );
            if (rootLink) path.add(rootLink);

            d3.selectAll('.link').classed('highlighted', l => path.has(l))
                .attr('stroke', l => path.has(l) ? DATA[currentLang].color : (theme === 'dark' ? 'var(--line-dark)' : 'var(--line-light)'));
        }

        function resetHighlight() {
            d3.selectAll('.link').classed('highlighted', false)
                .attr('stroke', theme === 'dark' ? 'var(--line-dark)' : 'var(--line-light)');
        }

        function showDetails(node) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('panel-content');

            panel.classList.remove('hidden-panel');

            let paramsHtml = '';
            if (node.params && node.params.length > 0) {
                paramsHtml = `
                    <div class="mt-8">
                        <h3 class="text-xs font-bold mb-3 opacity-40 uppercase tracking-widest">Parameters / Signature</h3>
                        <div class="flex flex-wrap gap-2">
                            ${node.params.map(p => `<span class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 mono text-xs">${p}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            let exampleHtml = '';
            if (node.example) {
                exampleHtml = `
                    <div class="mt-8">
                        <h3 class="text-xs font-bold mb-3 opacity-40 uppercase tracking-widest">Real World Example</h3>
                        <pre class="p-4 rounded-xl bg-slate-900 text-slate-300 mono text-xs overflow-x-auto border border-slate-800 leading-relaxed">${node.example}</pre>
                    </div>
                `;
            }

            let tipHtml = '';
            if (node.tip) {
                tipHtml = `
                    <div class="mt-8 p-4 rounded-xl bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500">
                        <h3 class="text-xs font-bold mb-1 text-blue-600 dark:text-blue-400 uppercase tracking-widest">Pro Tip</h3>
                        <p class="text-sm opacity-90 leading-relaxed">${node.tip}</p>
                    </div>
                `;
            }


            const relatedNodes = DATA[currentLang].nodes.filter(n => n.group === 'key' && n.parent === node.parent && n.id !== node.id);
            let relatedHtml = '';
            if (relatedNodes.length > 0) {
                relatedHtml = `
                    <div class="mt-10 pt-8 border-t border-slate-200 dark:border-slate-800">
                        <h3 class="text-xs font-bold mb-3 opacity-40 uppercase tracking-widest">Related Keywords</h3>
                        <div class="flex flex-wrap gap-2">
                            ${relatedNodes.map(rn => `<button onclick="switchNode('${rn.id}')" class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">${rn.label}</button>`).join('')}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="mb-8">
                    <span class="text-[10px] uppercase tracking-widest opacity-50 font-bold mb-2 block">${node.group === 'root' ? 'Language' : node.group === 'cat' ? 'Category' : 'Keyword'}</span>
                    <h2 class="text-4xl font-extrabold mb-4 mono tracking-tight">${node.label}</h2>
                    <p class="text-lg opacity-80 leading-relaxed font-medium">${node.desc}</p>
                </div>
                ${paramsHtml}
                ${exampleHtml}
                ${tipHtml}
                ${relatedHtml}
                <div class="p-4 rounded-xl bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 mt-10">
                    <h3 class="text-xs font-bold mb-2 opacity-50 uppercase tracking-tighter">Context Fact</h3>
                    <p class="text-sm mono italic opacity-80">
                        ${node.group === 'key' ? `Belongs to the ${node.parent} family` : `Foundational element of ${currentLang}`}
                    </p>
                </div>
            `;
        }

        window.switchNode = (nodeId) => {
            const node = DATA[currentLang].nodes.find(n => n.id === nodeId);
            if (node) showDetails(node);
        };

        document.getElementById('close-panel').onclick = () => {
            document.getElementById('info-panel').classList.add('hidden-panel');
        };

        document.getElementById('recenter-btn').onclick = () => {
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        };

        document.getElementById('theme-toggle').onclick = () => {
            theme = theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
            renderGraph();
        };

        initTabs();
        switchLanguage('TypeScript');

        document.getElementById('search-input').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            if (!term) {
                resetSearch();
                return;
            }

            const langData = DATA[currentLang];
            const nodes = langData.nodes;

            d3.selectAll('.node').style('opacity', d => {
                const isMatch = d.label.toLowerCase().includes(term) || d.desc.toLowerCase().includes(term);
                return isMatch ? 1 : 0.2;
            });

            d3.selectAll('.link').style('opacity', d => {
                const source = nodes.find(n => n.id === (d.source.id || d.source));
                const target = nodes.find(n => n.id === (d.target.id || d.target));
                const isMatch = (source && source.label.toLowerCase().includes(term)) ||
                                (target && target.label.toLowerCase().includes(term));
                return isMatch ? 1 : 0.1;
            });
        };

        function resetSearch() {
            d3.selectAll('.node').style('opacity', 1);
            d3.selectAll('.link').style('opacity', 0.4);
        }
    </script>
</body>
</html>
